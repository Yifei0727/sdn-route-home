[supervisord]
nodaemon=true

[program:sss-local]
user=nobody

command=/usr/local/bin/sss-local -b 0.0.0.0:"%(ENV_LOCAL_PORT)s" -s 127.0.0.1:12948 -U -m aes-256-gcm -k "%(ENV_SSS_PASSWORD)s" -vvv  --tcp-no-delay
autostart=true
autorestart=true
stopsignal=KILL
stderr_logfile=/var/log/supervisor/sss-local.err.log
stdout_logfile=/var/log/supervisor/sss-local.out.log

[program:kcp-client]
user=nobody
command=/usr/local/bin/kcp-client -r "%(ENV_SSS_SERVER)s"
autostart=true
autorestart=true
stopsignal=KILL
stderr_logfile=/var/log/supervisor/kcp-client.err.log
stdout_logfile=/var/log/supervisor/kcp-client.out.log
